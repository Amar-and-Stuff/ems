<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Employee Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <nav>
        <div class="nav-left">
            <a th:href="@{/}">Employee Management System</a>
        </div>
        <div class="nav-right">
            <a th:if="${emp.getDesignation() == 'HR'}" th:href="@{/hr/add_employee}">Recruit</a>
            <a th:if="${emp.getDesignation() == 'MANAGER'}" th:href="@{/manager/manage}">Manage</a>
            <a th:href="@{/logout}">Logout</a>
        </div>
    </nav>
    <div class="info">profile
        <img th:src="@{images/employee-icon.jpg}" th:width="150" th:height="150" />
        <p class="info-item" th:text="|Name: ${emp.getName()}|" />
        <p class="info-item" th:text="|Designation: ${emp.getDesignation()}|" />
        <p class="info-item" th:text="|Salary: ${emp.getSalary()}|" />
        <p class="info-item" th:text="|Experience: ${emp.getExp()} years|" />
        <p class="info-item" th:text="|Experience: ${emp.getExp()} years|" />
        <p class="info-item" th:text="|Employee ID: ${emp.getId()}|" />
    </div>
</body>

</html>
